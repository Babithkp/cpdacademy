<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/admin/favicon.webp" type="image/x-icon">
    <link rel="stylesheet" href="/static/admin/admin.css">
    <title>Admin Panel</title>
</head>

<body>
    <h1>Admin Panel</h1>
    <h3><a class="btn" href="/logout">LOGOUT</a></h3>
    <table border="2" style="display: block;">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Progress</th>
            </tr>
        </thead>
        <tbody id="users">
        </tbody>
    </table>

    <dialog id="progress_container">
        <div id="user_info">
            <div>
                <label for="name">Name: </label>
                <span id="name">Shail Murtaza</span>
            </div>
            <div>
                <label for="email">Email: </label>
                <a id="email" href="mailto:shail@test.com">shail@test.com</a>
            </div>
        </div>
        <div>
            <table border="2">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Progress</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="progress">
                    <tr>
                        <td>1</td>
                        <td>Care Course</td>
                        <td>1 / 2</td>
                        <td class="done">PENDING</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="close_div">
            <button class="btn">CLOSE</button>
        </div>
    </dialog>

    <script src="/static/admin/admin.js"></script>
</body>

</html>
