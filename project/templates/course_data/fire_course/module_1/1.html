{% extends "course_data/module_layout.html" %}

{% block module %}
    <div id="learning-environment">
        <div style="display:none;" class="player-nav--top">
            <a style="display:none;" href="{{URL}}">next</a>
        </div>
        <div class="new-player player">
            <div class="new-player--inner">
                <div id="iframe_container" class="" style="min-height: auto;">
                    <div class="close-mode"></div>
                    <div style="display: none;">
                        <app-root data-course-name="Health and Safety - Fire Safety Training and Planning" data-course-completed="" data-course-id="4651" data-sco-id="135441" data-course-theme="6" data-topics="[]" data-isassessment="0" course_id="4651" course_name="Health and Safety - Fire Safety Training and Planning" data-canpassassessment="1" ng-version="16.2.5"></app-root>
                    </div>
                    <div class="js-angular-course-player angular-course-player" data-course-name="Health and Safety - Fire Safety Training and Planning" data-course-completed="" data-course-id="4651" data-sco-id="135441" data-course-theme="6" data-topics="[]" data-isassessment="0" data-canpassassessment="1">
                        <app-course-player></app-course-player>
                    </div>

                    <!-- Next and Previous -->
                    <div class="side-player-nav" style="">
                        <div class="player-nav__button player-nav__button--left">
                            <div class="player-nav__button-inner player-nav__next">
                                <span>Next</span>
                                <i class="icon-thick-chevron-up"></i>
                            </div>
                        </div>
                        <div class="player-nav__button player-nav__button--right">
                            <div class="player-nav__button-inner player-nav__prev disabled">
                                <i class="icon-thick-chevron-down"></i>
                                <span>Previous</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
