<div
  class="widget-area sidebar is-left-sidebar grid-25 tablet-grid-25 mobile-grid-100 grid-parent pull-75 tablet-pull-75"
  id="left-sidebar"
>
  <div class="inside-left-sidebar">
    <div class="ca-sidebar" id="ca-sidebar-37482">
      <aside
        class="ca-widget widget inner-padding widget_ldcourseprogress"
        id="ldcourseprogress-5"
      >
        <h2 class="widget-title">Progress</h2>
        <dd
          class="course_progress"
          title="
749 out of 749 steps completed"
        >
          <div class="course_progress_blue" style="width: 100%"></div>
        </dd>
      </aside>
      <aside
        class="ca-widget widget inner-padding widget_ldcoursenavigation"
        id="widget_ldcoursenavigation-5"
      >
        <h2 class="widget-title">Navigation</h2>
        <div
          class="course_navigation"
          data-widget_instance='{"course_id":151804,"widget_instance":{"title":"Navigation","show_lesson_quizzes":true,"show_topic_quizzes":false,"show_course_quizzes":true,"show_widget_wrapper":true,"current_lesson_id":0,"current_step_id":0}}'
          id="course_navigation"
        >
          <div class="ld-course-navigation-widget-content-contaiiner">
            <div class="learndash_navigation_lesson_topics_list">

                <!-- COURSE START -->
                {% for i in range(units| length) %}
              <div class="inactive" id="lesson_list-151805">
                <div
                  class="list_arrow collapse flippable lesson_completed"
                  onclick='return flip_expand_collapse("#lesson_list", 151805);'
                ></div>
                <div class="list_lessons">
                  <div class="lesson">
                    <a href="/lms/care-certificate/unit/{{units[i].unit_id}}"
                      >{{units[i].title}}</a
                    >
                  </div>
                  <div
                    class="flip learndash_topic_widget_list"
                    id="learndash_topic_dots-151805"
                    style="display: none"
                  >
                    <ul>
                        {% for x in range(topics[i]| length) %}
                      <li class="">
                        <span class="topic_item"
                          ><a
                            class="topic-completed"
                            href="/lms/care-certificate/unit/{{units[i].unit_id}}/topic/{{topics[i][x].section_id}}"
                            title="{{topics[i][x].title}}"
                            ><span
                              >{{topics[i][x].title}}</span
                            ></a
                          ></span
                        >
                      </li>
                      
                      <!-- <li class="quiz-item">
                        <span class="topic_item"
                          ><a
                            class="topic-completed"
                            href="/lms/care-certificate/unit/{{units[i].unit_id}}/quiz"
                            title="Care Certificate Standard 1 – Understanding Your Role Quiz"
                            ><span
                              >Care Certificate Standard 1 – Understanding Your
                              Role Quiz</span
                            ></a
                          ></span
                        >
                      </li> -->
                      {% endfor %}
                    </ul>
                  </div>
                </div>
              </div>
              {% endfor %}
              <!-- COURSE END -->

            </div>
            <!-- Closing <div class='learndash_navigation_lesson_topics_list'> -->
          </div>
        </div>
        <!-- Closing <div id='course_navigation'> -->
      </aside>
    </div>
  </div>
</div>
